packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

allowBuilds:
  # Analytics ping that ships inside @nestjs/swagger. Nothing needs to run.
  '@scarf/scarf': false
  bcrypt: true
  sharp: false
  unrs-resolver: false

# v11 defaults left deliberately UNSET:
#
#   minimumReleaseAge   defaults to 1440 (1 day)
#   blockExoticSubdeps  defaults to true
#
# See the trap note below before writing minimumReleaseAge explicitly.
